<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="puzzleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bmGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="bmGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Classic puzzle piece: rounded body + circular knob tab on top-right -->
  <g filter="url(#softShadow)">
    <path d="
      M 44 44
      H 156
      A 28 28 0 1 1 156 100
      H 212
      V 196
      A 16 16 0 0 1 196 212
      H 60
      A 16 16 0 0 1 44 196
      Z" fill="url(#puzzleGrad)"/>
  </g>

  <!-- Bookmark 1: top-left, larger -->
  <path d="M 64 92 L 64 168 L 86 148 L 108 168 L 108 92 Z" fill="url(#bmGrad1)" opacity="0.96"/>
  <!-- Bookmark 2: middle -->
  <path d="M 122 92 L 122 160 L 142 142 L 162 160 L 162 92 Z" fill="url(#bmGrad2)" opacity="0.9"/>
  <!-- Bookmark 3: small accent bottom -->
  <path d="M 64 178 L 64 204 L 76 194 L 88 204 L 88 178 Z" fill="#FFFFFF" opacity="0.8"/>
</svg>
